name: dockingvina
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Web 框架
  - fastapi
  - uvicorn
  # 数据库 (PostgreSQL)
  - psycopg2
  # 分子对接
  - meeko
  - mpi4py
  - openbabel
  - rdkit
  - vina
  # 数据处理
  - pandas
  - tqdm
  - pyyaml
  # pip 依赖
  - pip
  - pip:
    - aiohttp>=3.8.0  # SeaweedFS HTTP 客户端
    - python-dotenv>=1.0.0  # 环境变量加载