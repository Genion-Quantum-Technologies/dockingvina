# ============================================================
# DockingVina Docker Compose 配置
# ============================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: dockingvina-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-mydatabase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockingvina-network

  # SeaweedFS Master (可选 - 用于对象存储)
  seaweedfs-master:
    image: chrislusf/seaweedfs
    container_name: dockingvina-seaweedfs-master
    command: "master -ip=seaweedfs-master -port=9333"
    ports:
      - "9333:9333"
    networks:
      - dockingvina-network
    profiles:
      - storage

  # SeaweedFS Volume
  seaweedfs-volume:
    image: chrislusf/seaweedfs
    container_name: dockingvina-seaweedfs-volume
    command: "volume -mserver=seaweedfs-master:9333 -port=8080 -ip=seaweedfs-volume"
    depends_on:
      - seaweedfs-master
    ports:
      - "8080:8080"
    volumes:
      - seaweedfs_data:/data
    networks:
      - dockingvina-network
    profiles:
      - storage

  # SeaweedFS Filer
  seaweedfs-filer:
    image: chrislusf/seaweedfs
    container_name: dockingvina-seaweedfs-filer
    command: "filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -port=8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume
    ports:
      - "8888:8888"
    networks:
      - dockingvina-network
    profiles:
      - storage

  # SeaweedFS S3 Gateway
  seaweedfs-s3:
    image: chrislusf/seaweedfs
    container_name: dockingvina-seaweedfs-s3
    command: "s3 -filer=seaweedfs-filer:8888 -port=8333"
    depends_on:
      - seaweedfs-filer
    ports:
      - "8333:8333"
    networks:
      - dockingvina-network
    profiles:
      - storage

  # DockingVina 应用服务
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dockingvina:latest
    container_name: dockingvina-app
    environment:
      # 数据库配置
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-mydatabase}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      # SeaweedFS 配置
      SEAWEED_API_TYPE: ${SEAWEED_API_TYPE:-filer}
      SEAWEED_FILER_ENDPOINT: ${SEAWEED_FILER_ENDPOINT:-http://seaweedfs-filer:8888}
      SEAWEED_S3_ENDPOINT: ${SEAWEED_S3_ENDPOINT:-http://seaweedfs-s3:8333}
      SEAWEED_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:-}
      SEAWEED_SECRET_KEY: ${SEAWEED_SECRET_KEY:-}
      SEAWEED_BUCKET: ${SEAWEED_BUCKET:-dockingvina}
      # 任务配置
      TASK_QUERY_INTERVAL: ${TASK_QUERY_INTERVAL:-180}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-3}
      # 对接配置
      DOCKING_NUM_CPU: ${DOCKING_NUM_CPU:-8}
      # BINANA 配置
      BINANA_ENABLED: ${BINANA_ENABLED:-true}
      BINANA_AUTO_ANALYZE: ${BINANA_AUTO_ANALYZE:-true}
      BINANA_TIMEOUT: ${BINANA_TIMEOUT:-300}
      # 文件路径配置
      RESOURCE_DIR: /tmp/docking_vina_app/resource
      TEMP_DIR: /tmp/docking_vina_app
    volumes:
      # 资源目录挂载 (蛋白质文件、模型等)
      - ../resource:/app/resource:ro
      # 日志目录挂载
      - dockingvina_logs:/app/logs
      # 临时文件目录 (对接结果)
      - dockingvina_temp:/tmp/docking_vina_app
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - dockingvina-network
    restart: unless-stopped

volumes:
  postgres_data:
    name: dockingvina-postgres-data
  seaweedfs_data:
    name: dockingvina-seaweedfs-data
  dockingvina_logs:
    name: dockingvina-logs
  dockingvina_temp:
    name: dockingvina-temp

networks:
  dockingvina-network:
    name: dockingvina-network
    driver: bridge
