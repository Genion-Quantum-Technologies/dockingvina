# ============================================================
# DockingVina Docker Compose 开发环境配置
# 用于本地开发，支持热重载
# ============================================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: dockingvina-dev-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dockingvina-dev-network

  # DockingVina 开发服务
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dockingvina:dev
    container_name: dockingvina-dev-app
    environment:
      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secret
      DB_NAME: mydatabase
      # SeaweedFS 配置 (使用外部服务)
      SEAWEED_API_TYPE: filer
      SEAWEED_FILER_ENDPOINT: http://host.docker.internal:8888
      SEAWEED_S3_ENDPOINT: http://host.docker.internal:8333
      # 任务配置
      TASK_QUERY_INTERVAL: 60
      MAX_CONCURRENT_TASKS: 2
      # 对接配置
      DOCKING_NUM_CPU: 4
      # BINANA 配置
      BINANA_ENABLED: true
      BINANA_AUTO_ANALYZE: true
    volumes:
      # 源代码挂载 (支持热重载)
      - ../src:/app/src:ro
      - ../my_toolsets:/app/my_toolsets:ro
      - ../gypsum_dl:/app/gypsum_dl:ro
      - ../resource:/app/resource:ro
      # 日志和临时文件
      - ../logs:/app/logs
      - dockingvina_dev_temp:/tmp/docking_vina_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dockingvina-dev-network
    # 开发模式使用 reload
    command: ["uvicorn", "dockingvina.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_dev_data:
    name: dockingvina-dev-postgres-data
  dockingvina_dev_temp:
    name: dockingvina-dev-temp

networks:
  dockingvina-dev-network:
    name: dockingvina-dev-network
    driver: bridge
