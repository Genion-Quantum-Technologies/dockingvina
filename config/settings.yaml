# ============ DockingVina 配置文件 ============

# ============ 服务器配置 ============
server:
  host: "0.0.0.0"
  port: 8001

# ============ 数据库配置 (PostgreSQL) ============
database:
  host: "127.0.0.1"
  port: 5432
  user: "admin"
  password: "secret"
  name: "project1"
  pool:
    min_size: 1
    max_size: 10

# ============ 存储配置 (SeaweedFS) ============
storage:
  # API 类型: filer 或 s3
  api_type: "filer"
  
  # Filer API 配置
  filer_endpoint: "http://localhost:8888"
  bucket: "astramolecula"
  
  # S3 API 配置（备用）
  s3_endpoint: "http://localhost:8333"
  access_key: ""
  secret_key: ""
  
  # 临时文件目录
  temp_dir: "/tmp/dockingvina"
  
  # 预签名 URL 过期时间（秒）
  presigned_url_expires: 3600

# ============ 任务配置 ============
task:
  query_interval: 180         # 查询任务间隔（秒）
  task_type: "docking"        # 任务类型
  max_concurrent_tasks: 3     # 最大并发任务数

# ============ Docking 默认参数 ============
docking:
  num_poses: 10
  energy_range: 3
  exhaustiveness: 8
  num_cpu: 8
  seed: 0
  min_ph: 6.0
  max_ph: 8.0

# ============ 文件路径配置 ============
paths:
  resource_dir: "./resource"
  temp_dir: "/tmp/dockingvina"
  log_dir: "./logs"

# ============ BINANA 分析配置 ============
binana:
  enabled: true               # 是否启用 BINANA 分析
  auto_analyze: true          # 对接完成后自动进行分析
  timeout: 300                # 分析超时时间（秒）
  binana_path: null           # BINANA 路径，null 为自动检测
  save_intermediate_files: false
  analysis_output_dir: "binding_analysis"

# ============ 日志配置 ============
logging:
  level: "INFO"               # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: null                  # 日志文件路径，null 表示仅控制台输出
